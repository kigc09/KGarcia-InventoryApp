<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8">
    <title th:text="'Item Registration :: ' + ${pageTitle ?: 'Home'}"></title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <div th:fragment="header-nav">
        <header>
            <img th:src="@{/Images/header.png}" alt="Logo">
            <h1>MCC Bookstore</h1>
        </header>
        <nav>
            <a th:href="@{/}">Home</a>
            <a th:href="@{/list}">Item List</a>
            <a sec:authorize="hasAnyRole('ADMIN', 'MNGR', 'ASSOC')" th:href="@{/register}">Register Item</a>
            <div class="header-logout">
                <a sec:authorize="isAnonymous()" th:href="@{/login}">Login</a>
                <form sec:authorize="isAuthenticated()" method="POST" th:action="@{/logout}">
                    <input type="submit" value="Logout">
                </form>
            </div>
        </nav>
        <div class="welcome" sec:authorize="isAuthenticated()">
            Welcome <span sec:authentication="principal.fullname">FULLNAME</span>
        </div>
    </div>
    <footer th:fragment="footer">
        <p>&copy; Registration 2026</p><br>
        <a href="mailto:info@itemregistration.com">Contact Us</a>
    </footer>

</body>
</html>
