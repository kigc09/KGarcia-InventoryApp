<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body  id="pageCenter">
    <div th:replace="~{fragments :: header-nav}"></div>
    <main>
        <div>
            <h3 class="searchFilter">Search or Filter Items</h3>
            <form class="searchFilter-form" method="GET" th:action="@{/list}">
                <label>Name: </label>
                <input type="text" name="searchName" th:value="${searchName}">
                <label>Type: </label>
                <select name="filterType">
                <option value=""></option>
                <option th:each="t : ${ItemType}"
                        th:value="${t.name()}"
                        th:text="${t}"
                        th:selected="${t == filterType}"
                >TYPE HERE</option>
            </select>
                <input type="submit" value="Search/Filter">
                <a th:href="@{/list}">Clear Search/Filter</a>
            </form>
        </div>


        <h2 class="item-list">Item List</h2>
        <div th:if="${itemDB == null || itemDB.isEmpty()}">
            <p>Empty.</p>
        </div>

        <div class="item-list-items" th:unless="${itemDB == null || itemDB.isEmpty()}">
            <section class="item" th:each="current : ${itemDB.content}">
                <img class="listItemImage" th:if="${current.hasImage()}"
                     th:src="${current.image.getDataUri()}" alt="Image of the item."/>
                <img class="listItemImage" th:unless="${current.hasImage()}"
                     th:src="@{/Images/noimage.png}" alt="No image provided."/><br>
                <h3 class="item-name"><a th:href="@{'/view/current/'+${current.id}}" th:text="${current.name}">NAME OF THE ITEM</a></h3>
                <p class="item-price">$<span  th:text="${#numbers.formatDecimal(current.price,1,2)}"></span></p>
            </section>
        </div>

        <!-- display the navigation -->
        <div class="listNavigation" th:if="${itemDB.totalPages > 1}">
            <!-- prevous page -->
            <a th:if="${itemDB.hasPrevious()}" th:href="@{/list(page=${itemDB.number - 1},
                                                                  searchName=${searchName},
                                                                  filterType=${filterType})}">
                Prev
            </a>
            <!-- no previous link -->
            <span th:unless="${itemDB.hasPrevious()}">Prev</span>

            <!-- numbered list -->
            <span th:each="pageNumber : ${#numbers.sequence(0, itemDB.totalPages - 1)}">
                <a th:if="${pageNumber != itemDB.number}"
                   th:href="@{/list(page=${pageNumber},
                                           searchName=${searchName},
                                           filterType=${filterType})}"
                   th:text="${pageNumber + 1}"> <!-- off by one for display -->
                    PAGENUMBER
                </a>

                <span th:unless="${pageNumber != itemDB.number}"
                      th:text="${pageNumber + 1}">
                    PAGENUMBER
                </span>

            </span>

            <!-- next page -->
            <a th:if="${itemDB.hasNext()}" th:href="@{/list(page=${itemDB.number + 1},
                                                                  searchName=${searchName},
                                                                  filterType=${filterType})}">
                Next
            </a>
            <!-- no previous link -->
            <span th:unless="${itemDB.hasNext()}">Next</span>
        </div>
    </main>
    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
