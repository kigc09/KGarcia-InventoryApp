spring:
  application:
    name: KGarcia-InventoryApp
  servlet:
    multipart:
      max-file-size: 5MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.example.kgarciainventoryapp.messaging"
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000



logging:
  file:
    name: logs/inventory-registration.log

  logback:
    rollingpolicy:
      file-name-pattern: "logs/inventory-registration-%d{yyyy-MM-dd}.%i.log"
      max-file-size: 10MB
      max-history: 30

item:
  security:
    jwt:
      secret: "${JWT_SECRET}"
      issuer: "item-registration"
      audience: "item-registration-api"
      token-duration: "${JWT_DURATION:8h}"

  messaging:
    item-status-topic: ${KAFKA_ITEM_STATUS_TOPIC:item-status-events}
    logging-group: ${KAFKA_LOGGING_GROUP:item-event-logger}
    email-group:   ${KAFKA_EMAIL_GROUP:item-email-notifications}
    partitions: ${KAFKA_TOPIC_PARTITIONS:3}
    replicas: ${KAFKA_TOPIC_REPLICAS:1}
  email:
    from-address: ${MAIL_FROM:no-reply@itemregistration.local}